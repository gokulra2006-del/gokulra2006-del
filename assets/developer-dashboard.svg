<radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".17"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<clipPath id="scan"><circle cx="879" cy="242" r="105"/></clipPath>
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e6f1ff}.muted{fill:#90a8be}.cyan{fill:#67e8f9}.mint{fill:#6ee7b7}.panel{fill:#0f2235;stroke:#2c4a61;stroke-width:1.2}.pulse{animation:pulse 2.4s ease-in-out infinite}.blink{animation:blink 1.1s steps(2) infinite}.spin{transform-origin:879px 242px;animation:spin 7s linear infinite}.dash{stroke-dasharray:8 12;animation:dash 3s linear infinite}.float{animation:float 4s ease-in-out infinite alternate}.sweep{animation:sweep 4s ease-in-out infinite}.bars rect{transform-box:fill-box;transform-origin:center bottom;animation:bars 2.2s ease-in-out infinite alternate}.bars rect:nth-child(2){animation-delay:.3s}.bars rect:nth-child(3){animation-delay:.6s}.bars rect:nth-child(4){animation-delay:.9s}@keyframes pulse{50%{opacity:.25}}@keyframes blink{50%{opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-40}}@keyframes float{to{transform:translateY(-6px)}}@keyframes sweep{50%{transform:translateX(90px)}}@keyframes bars{to{transform:scaleY(.42)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
