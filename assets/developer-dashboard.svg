<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Animated developer dashboard: Gokul R, software engineering, AI systems and cloud security learning">
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e5edf8}.muted{fill:#8fa5be}.accent{fill:#61dafb}.green{fill:#48e0a4}.panel{fill:#121d2c;stroke:#293a4f;stroke-width:1}.pulse{animation:pulse 2.4s ease-in-out infinite}.blink{animation:blink 1s steps(2) infinite}.slide{animation:slide 5s ease-in-out infinite alternate}.flow{stroke-dasharray:7 9;animation:dash 2s linear infinite}@keyframes pulse{50%{opacity:.25}}@keyframes blink{50%{opacity:0}}@keyframes slide{to{transform:translateX(90px)}}@keyframes dash{to{stroke-dashoffset:-32}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
